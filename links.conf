# What install.sh links where.
#
#   <path in repo>    <target on machine>
#
# - Targets may start with ~ (expanded to $HOME).
# - A source ending in /* links each child into the target directory
#   (used for skills, so agents can keep their own extra skills alongside).
# - Blank lines and lines starting with # are ignored.

# --- Shared instructions ----------------------------------------------------
agents/AGENTS.md        ~/.agents/AGENTS.md
agents/AGENTS.md        ~/.codex/AGENTS.md
agents/AGENTS.md        ~/.config/opencode/AGENTS.md
agents/AGENTS.md        ~/.pi/agent/AGENTS.md

# --- Claude Code -------------------------------------------------------------
agents/AGENTS.md        ~/.claude/CLAUDE.md
claude/settings.json    ~/.claude/settings.json

# --- OpenCode ----------------------------------------------------------------
opencode/opencode.json  ~/.config/opencode/opencode.json

# --- Pi ----------------------------------------------------------------------
pi/mcp.json             ~/.pi/agent/mcp.json

# --- Skills ------------------------------------------------------------------
# ~/.claude/skills  -> Claude Code (OpenCode also reads it)
# ~/.agents/skills  -> the cross-agent location (Codex, OpenCode, Pi)
skills/*                ~/.claude/skills
skills/*                ~/.agents/skills
